<section class="teams-page">
  <h1 class="teams-page__title">Teams</h1>

  <div class="teams-page__layout">
    <app-team-list
      [state]="teamsState()"
      [catalog]="catalog()"
      [selectedId]="selection.selectedId()"
      (toggleSelect)="selection.toggle($event)"
      (remove)="deleteTeam($event)"
      (retry)="retryTeams()"
    />

    <aside class="teams-page__aside">
      <app-team-summary
        [team]="selection.selectedTeam()"
        [summary]="selection.summary()"
        (retry)="retryPokemon()"
      />
    </aside>
  </div>
</section>

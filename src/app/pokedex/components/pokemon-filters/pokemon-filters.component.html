<div class="pokemon-filters" role="search" aria-label="Filter Pokémon">
  <div class="pokemon-filters__field pokemon-filters__field--search">
    <label class="pokemon-filters__label" for="pokemon-search">Search by name</label>
    <div class="pokemon-filters__search">
      <img
        class="pokemon-filters__search-icon"
        src="assets/icons/ic_search.svg"
        width="18"
        height="18"
        alt=""
        aria-hidden="true"
      />
      <input
        #searchInput
        id="pokemon-search"
        class="pokemon-filters__input"
        type="search"
        placeholder="e.g. Pikachu"
        autocomplete="off"
        spellcheck="false"
        [value]="search()"
        (input)="searchChange.emit(searchInput.value)"
      />
      @if (search()) {
        <button
          class="pokemon-filters__clear"
          type="button"
          aria-label="Clear search"
          (click)="clearSearch()"
        >
          <img src="assets/icons/ic_close.svg" width="16" height="16" alt="" aria-hidden="true" />
        </button>
      }
    </div>
  </div>

  <div class="pokemon-filters__field">
    <label class="pokemon-filters__label" for="pokemon-type">Type</label>
    <select
      #typeSelect
      id="pokemon-type"
      class="pokemon-filters__input pokemon-filters__select"
      (change)="onTypeChange(typeSelect.value)"
    >
      <option value="" [selected]="type() === null">All types</option>
      @for (name of typeNames; track name) {
        <option [value]="name" [selected]="name === type()">{{ name | displayName }}</option>
      }
    </select>
  </div>
</div>
